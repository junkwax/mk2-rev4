# DOSBox configuration for MK2 build (Phase B: assemble + link).
# Phase A (LOAD2) runs first via dosbox_load2.conf. build.py orchestrates.

[sdl]
fullscreen = false
autolock = false

[dosbox]
memsize = 16

[cpu]
core = dynamic
fpu = true
cputype = auto
cycles = max 105%

[autoexec]
# Mount mk2-main root as C:
mount c .
c:
# Tools are in C:\TOOLS (GSPA.EXE, GSPLNK.EXE, GMAKE.EXE, BIGSREC.EXE)
path=Z:\;C:\;C:\TOOLS
set TEMP=C:\
set TMP=C:\
set IMGDIR=C:\DATA
set SRCDIR=C:\DATA
cd src
gmake -m > ..\build.log
exit
