# DOSBox configuration for MK2 build (Phase A: LOAD2 / image build).
# Run before assembly so src/*.TBL can be promoted from tmp/load2/*.TBL
# before GSPA reads them. build.py orchestrates.

[sdl]
fullscreen = false
autolock = false

[dosbox]
memsize = 16

[cpu]
core = dynamic
fpu = true
cputype = auto
cycles = max 105%

[autoexec]
mount c .
c:
path=Z:\;C:\;C:\TOOLS
set TEMP=C:\
set TMP=C:\
set IMGDIR=C:\DATA
set SRCDIR=C:\DATA
cd \data
call IMGBUILD.BAT
exit
